<html lang="zh-CN"><meta charset="utf-8"><title>Multi-GPU coverage report</title><body><p id="loading">正在打开离线报告…</p><script>const coverageChunks=[];</script>
<script src="report-data-1.js"></script><script src="report-data-2.js"></script><script src="report-data-3.js"></script><script src="report-data-4.js"></script>
<script>(async () => { try { if (coverageChunks.length !== 4) throw Error("报告数据文件不完整"); const stream = new Blob(coverageChunks.map(c => new Uint8Array(c))).stream().pipeThrough(new DecompressionStream("gzip")); const report = await new Response(stream).text(); document.open(); document.write(report); document.close(); } catch (err) { document.getElementById("loading").textContent = "无法打开报告：" + err; } })();</script></body></html>
